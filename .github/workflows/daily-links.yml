name: Dynamic Unique Repo CDN Drop

on:
  schedule:
    # Runs 8 times a day: exactly every 3 hours starting at 12:00 AM UTC
    - cron: "0 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate, commit, and push unique repo CDN drop
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/make_links.py

      - name: Post file to Discord
        if: ${{ vars.POST_DISCORD == 'true' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/post_discord.py
