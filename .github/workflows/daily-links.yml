name: Daily CDN Link Drop

on:
  schedule:
    - cron: "0 6 * * *"   # Runs daily at 06:00 UTC
  workflow_dispatch:       # Allows manual runs from your GitHub Actions tab

permissions:
  contents: write

jobs:
  build-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CDN links and download SVGs recursively
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_links.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily recursive SVG drop $(date -u +%Y-%m-%d)"
          file_pattern: batch/   # Tracks all downloaded folders and links.txt
          commit_user_name: "link-dropper"
          commit_user_email: "link-dropper@users.noreply.github.com"

      - name: Post batch to Discord
        if: ${{ vars.POST_DISCORD == 'true' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/post_discord.py
