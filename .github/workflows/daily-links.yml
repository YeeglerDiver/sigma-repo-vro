name: Daily CDN Link Drop

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  build-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate CDN links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_links.py

      - name: Commit and push
        run: |
          git config user.name "link-dropper"
          git config user.email "link-dropper@users.noreply.github.com"
          git add batch/links.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily link drop $(date -u +%Y-%m-%d)"
            git pull origin main --rebase
            git push
          fi

      - name: Post batch to Discord
        if: ${{ vars.POST_DISCORD == 'true' }}
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/post_discord.py
